<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Antigone &middot; A Companion</title>
<style>
/* ============================================================
   ANTIGONE — palette grounded in the play's materials:
   turned earth / sealed tomb (ground), bone & dust (text),
   dried blood (death, sparing), buried bronze (the sacred &
   the interactive). Not pottery black-and-red; not cream+clay.
   Signature: a handful of dust scattered along every threshold.
   ============================================================ */
:root{
  --earth:   #14100c;   /* ground: turned earth, the unlit tomb */
  --earth-2: #1f1811;   /* raised surface / cards */
  --earth-3: #29211a;   /* hover / deeper panel */
  --bone:    #eae1d0;   /* primary text */
  --dust:    #b3a585;   /* muted text, the parched plain */
  --stone:   #6e685c;   /* hairlines, tracked labels */
  --bronze:  #c6a052;   /* interactive: links, xrefs, active — the sacred, the edict */
  --bronze-d:#8f7433;
  --oxblood: #a2382b;   /* death only */
  --oxblood-d:#6f2620;
  --patina:  #7c8a72;   /* the unwritten law, the chthonic */
  --maxread: 63ch;
  --disp: "Optima","Palatino Linotype",Palatino,"Iowan Old Style",Georgia,serif;
  --body: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --util: "Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--earth);min-height:100vh;color-scheme:dark}
body{min-height:100vh}
body{
  margin:0; background:var(--earth); color:var(--bone);
  font-family:var(--body); font-size:18px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-wrap:break-word;
}
a{color:inherit}
button{font-family:inherit}

/* dust-scatter divider — the signature, reused at thresholds */
.dust{
  height:14px; border:0; margin:0;
  background-image:
    radial-gradient(1.5px 1.5px at 10% 60%, var(--dust) 40%, transparent 42%),
    radial-gradient(1px 1px at 22% 30%, var(--dust) 40%, transparent 42%),
    radial-gradient(1.5px 1.5px at 33% 70%, var(--stone) 40%, transparent 42%),
    radial-gradient(1px 1px at 45% 45%, var(--dust) 40%, transparent 42%),
    radial-gradient(1.5px 1.5px at 57% 62%, var(--bronze-d) 40%, transparent 42%),
    radial-gradient(1px 1px at 68% 35%, var(--dust) 40%, transparent 42%),
    radial-gradient(1.5px 1.5px at 79% 66%, var(--stone) 40%, transparent 42%),
    radial-gradient(1px 1px at 90% 40%, var(--dust) 40%, transparent 42%);
  opacity:.7;
}

/* ---- shell ---- */
.wrap{max-width:920px;margin:0 auto;padding:0 20px}
header.top{
  position:sticky;top:0;z-index:40;
  background:rgba(20,16,12,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--earth-3);
}
.top .row{max-width:920px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand{
  font-family:var(--disp);letter-spacing:.24em;text-transform:uppercase;
  font-size:.86rem;color:var(--bone);cursor:pointer;background:none;border:0;padding:6px 0;
}
.brand b{color:var(--bronze);font-weight:600}
nav.modes{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
nav.modes button{
  background:none;border:0;color:var(--dust);cursor:pointer;
  font-family:var(--util);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
  padding:7px 10px;border-radius:3px;
}
nav.modes button:hover{color:var(--bone);background:var(--earth-2)}
nav.modes button[aria-current="true"]{color:var(--earth);background:var(--bronze)}

main{padding:28px 0 96px;min-height:70vh}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- home / hero ---- */
.hero{padding:40px 0 8px}
.eyebrow{
  font-family:var(--util);font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--stone);margin:0 0 18px;
}
.hero h1{
  font-family:var(--disp);font-weight:600;line-height:1.12;margin:0;
  font-size:clamp(2rem,6.4vw,3.5rem);letter-spacing:.005em;
}
.hero h1 .b{color:var(--oxblood)}
.hero h1 .g{color:var(--bronze)}
.hero p.lede{max-width:58ch;color:var(--dust);font-size:1.06rem;margin:22px 0 0}

.ways{display:grid;grid-template-columns:1fr;gap:12px;margin:30px 0 0}
@media(min-width:640px){.ways{grid-template-columns:1fr 1fr}}
.way{
  text-align:left;cursor:pointer;background:var(--earth-2);border:1px solid var(--earth-3);
  border-radius:7px;padding:18px 18px 16px;color:var(--bone);transition:border-color .18s,transform .18s;
}
.way:hover{border-color:var(--bronze-d);transform:translateY(-2px)}
.way .k{font-family:var(--util);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--bronze);display:block;margin-bottom:7px}
.way .t{font-family:var(--disp);font-size:1.22rem;display:block;margin-bottom:5px}
.way .d{color:var(--dust);font-size:.92rem;line-height:1.45}

/* ---- generic view heading ---- */
.vhead{margin:6px 0 20px}
.vhead .eyebrow{margin-bottom:10px}
.vhead h2{font-family:var(--disp);font-weight:600;font-size:1.9rem;margin:0;letter-spacing:.01em}
.vhead p{color:var(--dust);max-width:60ch;margin:12px 0 0}

/* ---- themes view ---- */
.cluster{margin:0 0 26px}
.cluster h3{
  font-family:var(--disp);font-size:1.28rem;margin:0 0 4px;color:var(--bone);
  border-left:3px solid var(--bronze);padding-left:12px;
}
.cluster .blurb{color:var(--dust);font-size:.95rem;margin:0 0 12px;padding-left:15px;max-width:58ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-left:15px}

/* entity chip (used in themes, house, scenes, rels) */
.chip{
  cursor:pointer;background:var(--earth-2);border:1px solid var(--earth-3);
  border-radius:20px;padding:7px 14px;color:var(--bone);font-size:.9rem;
  display:inline-flex;align-items:center;gap:8px;transition:border-color .16s,background .16s;
}
.chip:hover{border-color:var(--bronze-d);background:var(--earth-3)}
.chip .tag{font-family:var(--util);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--stone)}
.chip.major{border-color:#3a2f22}
.chip.major .dotm{width:5px;height:5px;border-radius:50%;background:var(--bronze);display:inline-block}

/* ---- by the play (scenes) ---- */
.spine{border-left:2px solid var(--earth-3);margin-left:6px;padding-left:0}
.beat{position:relative;padding:0 0 4px 26px;margin:0 0 18px}
.beat::before{content:"";position:absolute;left:-7px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--earth);border:2px solid var(--stone)}
.beat.ode::before{background:var(--bronze);border-color:var(--bronze)}
.beat .bk{font-family:var(--util);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--stone)}
.beat.ode .bk{color:var(--bronze)}
.beat h4{font-family:var(--disp);font-size:1.16rem;margin:2px 0 6px}
.beat .bs{color:var(--dust);font-size:.94rem;margin:0 0 10px;max-width:60ch}

/* ---- house (relational) ---- */
.houses{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:760px){.houses{grid-template-columns:1fr 1fr}}
.housecard{background:var(--earth-2);border:1px solid var(--earth-3);border-radius:9px;padding:20px}
.housecard h3{font-family:var(--disp);font-size:1.2rem;margin:0 0 3px}
.housecard .sub{font-family:var(--util);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--stone);margin:0 0 16px}
.gen{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px;align-items:center}
.genlabel{font-family:var(--util);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dust);width:100%;margin-top:8px}
.hinge{margin-top:22px;padding-top:16px;border-top:1px dashed var(--earth-3);color:var(--dust);font-size:.92rem;max-width:60ch}
.hinge b{color:var(--bone);font-weight:600}

/* ---- reference ---- */
.refgrid{display:grid;grid-template-columns:1fr;gap:2px}
.refrow{display:flex;gap:12px;align-items:baseline;padding:11px 8px;border-bottom:1px solid var(--earth-2);cursor:pointer}
.refrow:hover{background:var(--earth-2)}
.refrow .rn{font-family:var(--disp);font-size:1.06rem;min-width:34%}
.refrow .re{color:var(--dust);font-size:.88rem;line-height:1.4}
.refrow .rt{font-family:var(--util);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);min-width:76px;text-align:right}

/* ---- entity page ---- */
.entity{max-width:var(--maxread)}
.entity .kicker{font-family:var(--util);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--stone);display:flex;gap:12px;align-items:center;margin:0 0 8px}
.entity .kicker .tier{color:var(--bronze)}
.entity h1{font-family:var(--disp);font-weight:600;font-size:clamp(2rem,7vw,2.9rem);margin:0;line-height:1.1}
.entity .aka{color:var(--dust);font-style:italic;margin:6px 0 0}
.essence{font-size:1.24rem;line-height:1.5;color:var(--bone);margin:18px 0 4px;max-width:56ch}
.essence .xref{color:var(--bronze)}

section.sec{border-top:1px solid var(--earth-2);margin-top:14px}
section.sec > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 0 12px}
section.sec > summary::-webkit-details-marker{display:none}
section.sec > summary .h{font-family:var(--disp);font-size:1.24rem;color:var(--bone)}
section.sec > summary .mk{margin-left:auto;color:var(--stone);font-family:var(--util);font-size:1.2rem;line-height:1;transition:transform .2s}
section.sec[open] > summary .mk{transform:rotate(45deg)}
section.sec .body{padding:0 0 18px}
section.sec .body p{margin:0 0 14px}

/* depth panels: Beneath / Beyond */
.panel{border:1px solid var(--earth-3);border-radius:8px;margin:14px 0 0;overflow:hidden;background:var(--earth-2)}
.panel > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:15px 18px}
.panel > summary::-webkit-details-marker{display:none}
.panel > summary .pl{font-family:var(--util);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase}
.panel.beneath > summary .pl{color:var(--patina)}
.panel.beyond > summary .pl{color:var(--bronze)}
.panel > summary .pt{font-family:var(--disp);font-size:1.02rem;color:var(--dust)}
.panel > summary .mk{margin-left:auto;color:var(--stone);font-family:var(--util);transition:transform .2s}
.panel[open] > summary .mk{transform:rotate(45deg)}
.panel .pbody{padding:2px 18px 18px}
.panel .pbody p{margin:0 0 13px;font-size:.98rem}
.panel .pbody p:last-child{margin-bottom:0}
.panel .xref{color:var(--bronze)}

.rels{margin:26px 0 0}
.rels h3{font-family:var(--util);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--stone);margin:0 0 12px}
.rel{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--earth-2);cursor:pointer}
.rel:hover .rname{color:var(--bronze)}
.rel .rname{font-family:var(--disp);font-size:1.04rem;min-width:38%}
.rel .rlab{color:var(--dust);font-size:.9rem}

.backbar{margin:0 0 18px}
.backbtn{background:none;border:0;color:var(--dust);cursor:pointer;font-family:var(--util);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;padding:6px 0}
.backbtn:hover{color:var(--bronze)}

/* inline cross-reference term */
.xref{color:var(--bronze);text-decoration:none;border-bottom:1px dotted var(--bronze-d);cursor:pointer;white-space:nowrap}
.xref:hover{border-bottom-style:solid}
.xref.broken{color:var(--oxblood);border-color:var(--oxblood)}

/* ---- popover (peek) ---- */
#pop{
  position:fixed;z-index:60;max-width:320px;width:calc(100vw - 32px);
  background:var(--earth-3);border:1px solid var(--bronze-d);border-radius:9px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);padding:15px 16px;display:none;
}
#pop.show{display:block;animation:fade .16s ease both}
#pop .pk{font-family:var(--util);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--stone);margin:0 0 4px}
#pop .pn{font-family:var(--disp);font-size:1.16rem;margin:0 0 6px}
#pop .pe{color:var(--dust);font-size:.92rem;line-height:1.45;margin:0 0 12px}
#pop .po{background:var(--bronze);color:var(--earth);border:0;border-radius:5px;cursor:pointer;font-family:var(--util);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding:8px 14px}
#pop .po:hover{background:var(--bone)}
@media(max-width:560px){
  #pop{left:16px!important;right:16px;width:auto;bottom:16px!important;top:auto!important;max-width:none}
}

footer.foot{color:var(--stone);font-family:var(--util);font-size:.7rem;letter-spacing:.08em;text-align:center;padding:10px 0 40px}

:focus-visible{outline:2px solid var(--bronze);outline-offset:2px;border-radius:2px}
/* pronunciation respelling */
.entity .pron{font-family:var(--util);font-size:.82rem;letter-spacing:.04em;color:var(--dust);margin:9px 0 0}
.entity .pron b{color:var(--patina);font-weight:600}
#pop .ppron{font-family:var(--util);font-size:.72rem;letter-spacing:.03em;color:var(--patina);margin:-2px 0 9px}
/* start-here orientation */
.orient{max-width:64ch;margin:32px 0 6px;padding:20px 22px 8px;background:var(--earth-2);border:1px solid var(--earth-3);border-left:3px solid var(--bronze);border-radius:8px}
.orient-h{font-family:var(--util);font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;color:var(--bronze);margin:0 0 15px}
.orient p{margin:0 0 13px;font-size:1rem;line-height:1.58;color:var(--bone)}
.orient p b{display:block;font-family:var(--util);font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze);margin:0 0 3px}
.orient .xhint{color:var(--bronze);border-bottom:1px dotted var(--bronze-d)}
/* scene kicker gloss */
.beat .bkg{color:var(--dust);margin-left:10px;text-transform:none;letter-spacing:.02em;font-size:.92em}
.beat .panel{margin-top:10px}
.panel.scene-stage > summary .pl{color:var(--dust)}
.panel.scene-turns > summary .pl{color:var(--bronze)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* --- opaque-ground guarantee (literal colors; must win everywhere) --- */
html{background-color:#14100c !important;color-scheme:dark}
body{background-color:#14100c !important;color:#eae1d0 !important;}
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background-color:#14100c;z-index:-1;pointer-events:none}
header.top{background-color:rgba(20,16,12,.97) !important}
main{background-color:transparent}
#pop{background-color:#1f1811 !important}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <button class="brand" onclick="go('#home')">ANTIGONE <b>&middot;</b> a companion</button>
    <nav class="modes" id="modes"></nav>
  </div>
</header>
<hr class="dust">
<main><div class="wrap" id="view"></div></main>
<hr class="dust">
<footer class="foot">SOPHOCLES &middot; c. 441 BCE &middot; an offline companion, not the play itself</footer>

<div id="pop" role="dialog" aria-label="Preview"></div>

<script>
"use strict";

/* ============================================================
   DATA — authored as data, never hand-written HTML.
   Non-ASCII as escapes; no backticks / ${} inside data strings.
   [[id|label]] tokens become peek/commit cross-links at render.
   ============================================================ */

var THEMES = [
  { id:"law",   name:"Law & Defiance",  blurb:"The edict of the city against the older, unwritten laws of the gods and the dead \u2014 and the girl who will not choose the city." },
  { id:"dead",  name:"Family & the Dead", blurb:"What the living owe a corpse; the claims of blood over the claims of the state; grief that will not be governed." },
  { id:"power", name:"Power & the City", blurb:"A new ruler, a shaken city, and the brittle certainty of a man who mistakes his will for order." },
  { id:"house", name:"The Doomed House",  blurb:"The curse on the line of Labdacus, working itself out to the last child of Oedipus." }
];

var TYPES = {
  character:"Character", concept:"Idea", place:"Place", object:"Object", chorus:"Chorus"
};

/* Scenes for the "By the Play" spine (Sophocles' structure). */
var SCENES = [
  { k:"Prologue", ode:false, g:"Opening scene", h:"Before dawn, two sisters", s:"In the grey before dawn, outside the palace of [[thebes|Thebes]], [[antigone|Antigone]] draws her sister [[ismene|Ismene]] aside with terrible news. Their uncle [[creon|Creon]], now king, has ordered their brother [[eteocles|Eteocles]] buried with honor while the other, [[polynices|Polynices]], is left to rot on the plain \u2014 no grave, no rite, on pain of death. Antigone means to bury him regardless, and asks for help.\n\nIsmene, afraid, refuses: they are only women, she pleads, and cannot fight the city. The sisters part in anger. In these first minutes the whole engine of the play is set running \u2014 [[creon|Creon]]'s [[edict|edict]] against the [[philia|claim of blood]], the law of the city against the [[unwritten_law|law of the gods]].", ents:["antigone", "ismene", "polynices", "edict"], stage:"A Greek play opened with a <em>prologos</em> \u2014 a scene before the chorus arrived, used to set the situation. Here it is a hushed pre-dawn conference, the two sisters alone, both roles played by masked men, as every role was. With only two or three actors sharing all the parts, Sophocles keeps the stage bare and lets the words do the work; the audience, who knew the myth cold, felt the dread under the whispering at once.", turns:"Everything to come is already latent here. The two irreconcilable claims \u2014 the city's [[edict|law]] and the [[unwritten_law|law owed the dead]] \u2014 and the two unbending temperaments are set before the chorus has even entered. Watch [[antigone|Antigone]]'s scorn for caution and her vow to lie beside the brother she loves: the play's whole moral engine, stated in miniature." },
  { k:"Parodos", ode:true, g:"Entry song \u00b7 the chorus arrives", h:"The chorus greets the dawn", s:"As the sun rises the [[chorus|elders of Thebes]] file in singing the play's first ode. They celebrate deliverance: the night before, [[seven|seven captains]] led by the exiled [[polynices|Polynices]] stormed the city's gates, and [[thebes|Thebes]] has survived \u2014 though the two brothers fell by each other's hands. The song is bright with relief, an enemy driven off like a routed eagle. But it rings hollow against what the audience already knows: the corpse on the plain, and the new king's [[edict|edict]] that will turn this victory into ruin.", ents:["chorus", "seven", "thebes"], stage:"The <em>parodos</em> is the chorus's entrance-song. Up to fifteen elders filed in along the side ramps into the round dancing-floor, the <em>orchestra</em>, moving to the reedy double-pipe called the aulos. Odes came in matched pairs \u2014 strophe and antistrophe, turn and counter-turn \u2014 the dance reversing direction with the music. That music and choreography are wholly lost; what survives is the words alone.", turns:"The joy is the point, and the trap. Sophocles lets the city celebrate its survival at the very moment its new king prepares the act that will undo it \u2014 dramatic irony the audience feels in the gap between the song and what they know is coming. It also sets the civic stakes: [[thebes|Thebes]] is not a backdrop but a community with everything to lose." },
  { k:"First Episode", ode:false, g:"Spoken scene", h:"The edict, and dust on the body", s:"[[creon|Creon]] takes the stage as king and lays out his creed to the elders: the city before all, no traitor honored beside a patriot \u2014 and so [[polynices|Polynices]] stays unburied. It sounds, at first, like firm statecraft. Then a [[sentry|sentry]] stumbles in, terrified, with impossible news: someone has scattered [[dust|dust]] over the body, performing the forbidden rite, and no one saw how.\n\nSuspecting a plot against his rule, [[creon|Creon]] sends the guard back under threat of death to find the culprit. The frailest of acts \u2014 a handful of dry earth \u2014 has already broken the king's whole [[edict|law]].", ents:["creon", "sentry", "dust", "edict"], stage:"[[creon|Creon]]'s first speech is a set-piece: the new ruler steering the ship of state, a metaphor the Greeks loved. Against its high formality Sophocles sets the [[sentry|sentry]], written in low, colloquial, half-comic language \u2014 a deliberate loosening of tension before the grip tightens. The scene shows the economy of the form too, just two speaking actors and the silent [[chorus|chorus]] carrying the whole confrontation.", turns:"[[creon|Creon]]'s case is put at full strength, and that matters \u2014 the play refuses to make him a straw man, so his fall will be a real one. His principle of order collides for the first time with reverence for the dead, and the [[dust|handful of dust]] is the hairline crack that will widen into catastrophe." },
  { k:"First Stasimon", ode:true, g:"Choral ode", h:"Ode to Man", s:"The chorus sings the play's most famous song, the [[ode_to_man|Ode to Man]]: many things are formidable, it begins, and none more formidable than man. It surveys all he masters \u2014 the sea, the earth, the beasts, speech and law and the building of cities \u2014 and the one thing he cannot: an escape from death. The same restless genius, the [[chorus|elders]] warn, bends toward ruin as readily as toward good. Sung just after [[creon|Creon]]'s overreach and the unseen burial, it hangs over king and rebel alike \u2014 a hymn of wonder shadowed by dread.", ents:["ode_to_man", "chorus", "hubris"], stage:"A <em>stasimon</em> is a standing-song the [[chorus|chorus]] performs between episodes, sung and danced rather than spoken. The odes are where tragedy pulls back from plot to reflect, and this one floats almost free of the story to weigh humankind itself. Its force rides on a single word, <em>deinos</em>, at once wondrous and terrible \u2014 a doubleness the music would have carried in a way the page cannot.", turns:"The play's philosophical centre of gravity. Human power dazzles and appalls in the same breath, and the ode quietly holds both [[creon|Creon]] and [[antigone|Antigone]] up to judgement: is their fierce mastery greatness, or the [[hubris|overreach]] that ruins? It poses the question and, pointedly, refuses to answer it." },
  { k:"Second Episode", ode:false, g:"Spoken scene", h:"Caught", s:"The [[sentry|sentry]] returns in triumph, dragging [[antigone|Antigone]]. The guards had swept the body bare and waited; at midday she came back, found it exposed again, cried out, and covered it a second time in the open. Before [[creon|Creon]] she does not deny the deed \u2014 she claims it, and defends it with the play's ringing appeal to the [[unwritten_law|unwritten laws]] of the gods, which no mortal edict can overrule.\n\nKing and niece lock in a duel of wills neither will yield. [[ismene|Ismene]], breaking, now tries to share the blame and die beside her sister; [[antigone|Antigone]] refuses her the death she would not help earn. Two women stand condemned \u2014 and [[creon|Creon]] cannot see that crushing a girl this way is its own kind of defeat.", ents:["sentry", "antigone", "creon", "ismene", "unwritten_law"], stage:"This is the play's central <em>agon</em>, its formal debate: two positions argued to the hilt in long matched speeches, then narrowing into <em>stichomythia</em>, rapid line-for-line exchange like verbal sword-fighting. The entry of [[ismene|Ismene]] pushes the three-actor limit and shifts the geometry from a duel to something crueler, as [[antigone|Antigone]] turns even her sister away.", turns:"The collision at full voltage \u2014 and the birth of an argument the West never finished. [[antigone|Antigone]]'s appeal to the [[unwritten_law|unwritten laws]] is the founding text for every later claim that a higher justice stands above the state's command. Watch her refuse [[ismene|Ismene]] a share of the death: it seals her greatness and her terrible isolation in one stroke." },
  { k:"Second Stasimon", ode:true, g:"Choral ode", h:"The doom of the house", s:"The [[chorus|chorus]] turns to the [[house_curse|curse on the royal house]], watching ruin break over generation after generation like a black swell rolling down the sea. They trace the doom of the line of [[oedipus|Oedipus]] to the two sisters who are now all that remain of it. The song lifts the palace quarrel into something older and vaster \u2014 a bloodline working out its fate, the gods' hand behind it \u2014 and quietly reminds us that [[antigone|Antigone]]'s defiance is also an inheritance.", ents:["chorus", "house_curse", "oedipus"], stage:"Between the clashes the [[chorus|chorus]] widens the lens. A choral ode can leap across generations in a few stanzas, and here it sinks the present quarrel into the deep past of the [[house_curse|cursed house]]. The technique lets Sophocles supply mythic depth and foreboding without a single new event on stage \u2014 doom felt as music.", turns:"The ode reframes the whole conflict. What looked like one girl's choice is set inside an inherited doom, and the play's hardest question surfaces: is this fate, or character repeating itself down a [[house_curse|bloodline]]? It complicates any simple reading of [[antigone|Antigone]] as pure free will \u2014 she is also her father's daughter." },
  { k:"Third Episode", ode:false, g:"Spoken scene", h:"Father and son", s:"[[haemon|Haemon]], [[creon|Creon]]'s son and [[antigone|Antigone]]'s betrothed, comes to his father \u2014 not in revolt but in appeal. He begins in deference, then presses: the whole city grieves for the girl, and a wise ruler bends like a tree in flood rather than snap. It is the voice of reason and of [[polis_oikos|the people]] \u2014 and [[creon|Creon]] hears only a son unmanned by a woman.\n\nThe debate hardens into open combat, line trading against line, until [[haemon|Haemon]] storms out with a warning his father takes as a threat. Reason has failed; only grief is left to teach the king. Beneath the whole scene runs the force the next ode will name.", ents:["haemon", "creon", "antigone", "eros"], stage:"A second <em>agon</em>, father against son. It moves from [[haemon|Haemon]]'s careful, deferential opening into blistering <em>stichomythia</em>, the lines shortening as tempers climb, until he breaks off and rushes out. Greek staging kept such exits charged: a figure who storms through the doors is rarely seen alive again, and the audience knew to brace.", turns:"Two turns at once. We learn the city secretly sides with [[antigone|Antigone]] \u2014 so [[creon|Creon]] is overruling his people, not defending them \u2014 and we watch him cross from statesman to tyrant with the claim that the city belongs to its ruler. The public stakes and the private ruin of [[haemon|Haemon]] fuse here." },
  { k:"Third Stasimon", ode:true, g:"Choral ode", h:"Ode to Love", s:"The [[chorus|chorus]] sings to [[eros|Eros]], god of desire \u2014 unconquered in battle, who seizes gods and mortals alike and turns the steadiest heart to madness. They mean [[haemon|Haemon]], driven to break with his father over love of [[antigone|Antigone]]. But the song's darker point is that love here is no tenderness: it is one more power beyond human control, a tragic force pulling father and son toward destruction. Even as they sing, [[antigone|Antigone]] is led out toward her sentence, and the elders can barely watch.", ents:["chorus", "eros", "haemon", "antigone"], stage:"One of the shortest odes in the play, and among the most quoted. The [[chorus|chorus]] personifies [[eros|Eros]] and Aphrodite as raw cosmic forces rather than tender feeling. Odes like this comment on the action side-on, naming the hidden power behind a scene just witnessed instead of advancing the plot.", turns:"The ode names the hidden engine of the scene just past: [[eros|love]], which has turned [[haemon|Haemon]] against his father. It widens the disaster \u2014 what began as a clash over law is now devouring a family and a marriage. Desire enters as one more ungovernable force, and it is on the side of ruin." },
  { k:"Fourth Episode", ode:false, g:"Spoken scene", h:"The bride of stone", s:"[[antigone|Antigone]] is led toward the [[tomb|rock chamber]] where she will be sealed alive, and she sings her own lament \u2014 a wedding-song turned inside out. There will be no marriage now, no children; the cave will be her bridal room and death her only bridegroom. She grieves the life she is giving up even as she refuses to regret the act.\n\nHere too comes the play's strangest and most argued-over reasoning: a brother, with both parents dead, can never be replaced, as a husband or child might be \u2014 and so this duty stood above all others. The [[chorus|elders]] pity her and do not save her. She goes into the dark certain she was right, and entirely alone.", ents:["antigone", "tomb", "chorus"], stage:"Here the form turns to lament \u2014 a <em>kommos</em>, a grief-song shared between actor and [[chorus|chorus]], [[antigone|Antigone]]'s voice answering theirs as she is led to the [[tomb|tomb]]. It is a living funeral, staged as sung mourning. This is also where the text itself grows uncertain: [[antigone|Antigone]]'s cold reasoning about the irreplaceable brother is doubted by some editors as a later hand, and by Goethe as lines he wished away.", turns:"The emotional peak, and the point where sympathy swings fully to [[antigone|Antigone]] as she mourns the life she will never have. It is also the play's most unsettling moment: her reasoning that a brother outweighs any husband or child forces the question of whether she is heroine or fanatic. The [[tomb|living burial]] becomes the central image \u2014 a woman sealed between the living and the dead." },
  { k:"Fourth Stasimon", ode:true, g:"Choral ode", h:"Others, too, were shut away", s:"The [[chorus|chorus]] reaches back for old myths of others walled up or bound \u2014 a princess shut in a bronze chamber, others imprisoned by the gods \u2014 trying to fit [[antigone|Antigone]]'s fate into a pattern and so make it bearable. The comfort is cold and the parallels uneasy; the song half-consoles and half-unsettles. It is the community grasping for meaning even as it lets a girl be sealed away, unable to square what it feels with what its king has commanded.", ents:["chorus", "tomb", "antigone"], stage:"The [[chorus|chorus]] consoles by analogy, a device called the mythic <em>exemplum</em>: it lines up old stories of others shut in bronze rooms or bound by the gods and sets [[antigone|Antigone]] among them. The comfort is deliberately imperfect \u2014 the parallels do not quite fit, and the unease is the point, a community talking itself past what it cannot bear to watch.", turns:"The chorus tries to make the fate bearable and cannot, and that failure is the meaning. The play declines to hand us easy consolation or a tidy lesson; the elders' unease mirrors the audience's, and the refusal of comfort is its own kind of honesty." },
  { k:"Fifth Episode", ode:false, g:"Spoken scene", h:"The blind prophet", s:"[[tiresias|Tiresias]], the blind seer of [[thebes|Thebes]], is led on by a boy with a dire warning. The altars will not burn, the birds tear at one another \u2014 the city is sick with [[miasma|pollution]] because a corpse lies unburied. He tells [[creon|Creon]] plainly: a king who keeps the dead from the earth and buries the living in it will pay a corpse of his own blood.\n\n[[creon|Creon]] first accuses him of taking bribes, then, shaken as never before, breaks \u2014 this is the one voice he cannot argue away. He rushes off to free [[antigone|Antigone]] and bury [[polynices|Polynices]], doing at last, in a panic, what he should have done freely, and far too late.", ents:["tiresias", "creon", "miasma", "sight"], stage:"The prophet-scene is a Greek type-scene, and [[tiresias|Tiresias]] plays it as he did a generation earlier against [[oedipus|Oedipus]]: unwelcome truth, royal insult, then a curse that lands. Dramatically it is the <em>peripeteia</em>, the reversal on which the whole action swings. Its machinery is religious \u2014 failed sacrifice, the tearing of birds, omens read aloud, the gods made present without ever appearing.", turns:"The turn the whole tragedy pivots on \u2014 and its cruelty. [[creon|Creon]] finally bends, which means the gods, through [[tiresias|Tiresias]], have in effect ruled that [[antigone|Antigone]] was right all along. But the recognition comes a fraction too late to undo anything: the defining shape of Sophoclean tragedy, where the knowledge and the ruin arrive together." },
  { k:"Fifth Stasimon", ode:true, g:"Choral ode", h:"Call to Dionysus", s:"In a surge of hope the [[chorus|chorus]] calls on [[dionysus|Dionysus]], the wine-god born of a [[thebes|Theban]] princess and the city's own protector, to come with his dancing fire and cleanse [[thebes|Thebes]] of its sickness. It is the kind of song that ought to turn a play toward rescue \u2014 the god summoned at the eleventh hour. But the prayer goes unanswered; even as the elders sing, the ruin [[creon|Creon]] set moving has already arrived.", ents:["chorus", "dionysus", "thebes"], stage:"This is a <em>hyporcheme</em>, a lively dance of hope \u2014 a Sophoclean signature dropped in with terrible timing just before catastrophe. The [[chorus|chorus]] summons [[dionysus|Dionysus]], and the irony runs deep: he is the god of theatre itself, invoked by performers in his own sacred precinct, at a festival held in his honour, and asked to save a city he will not save.", turns:"The cruelest irony in the play \u2014 a song of rescue raised at the very instant the blows are landing offstage. The hope is real to the [[chorus|chorus]] and already void to the audience. Everything the elders pray for, healing and the god's coming and the city made whole, is exactly what will not arrive." },
  { k:"Exodos", ode:false, g:"The close \u00b7 final exit", h:"Too late", s:"A [[messenger|messenger]] brings the end in from offstage, as Greek tragedy always does. [[creon|Creon]] reached the [[tomb|tomb]] too late: [[antigone|Antigone]] had already taken her own life within it, and [[haemon|Haemon]], finding her, turned on his father and then upon himself, dying at her side.\n\nAs the messenger speaks, [[creon|Creon]]'s wife [[eurydice|Eurydice]] listens in silence and slips away; word soon follows that she too is gone, with a last curse on his name. [[creon|Creon]] returns carrying his son's body and is met with news of his wife's \u2014 the [[edict|edict]] meant to guard the city has emptied his own house instead. He begs only to be led out of sight. The [[chorus|chorus]] closes on the play's hard wisdom: the proud pay heavy blows for their pride, and the understanding, when it comes, comes too late to be worth anything.", ents:["messenger", "creon", "antigone", "haemon", "eurydice", "edict"], stage:"The deaths arrive by convention, through a [[messenger|messenger]]'s long narrative speech, the <em>rhesis</em>: Greek tragedy keeps its violence offstage and lets language make it worse than any staging could. The interior ruin may then have been wheeled into view on the <em>ekkyklema</em>, a rolling platform used to reveal what happened indoors. The [[chorus|chorus]] closes in a quiet marching rhythm, releasing the audience from the tension the Greeks called catharsis.", turns:"The catastrophe, and the bitter wisdom the play leaves us holding. Both houses are destroyed; [[creon|Creon]] survives only to understand, too late, what his [[edict|edict]] cost. The [[chorus|chorus]]'s last word is that the proud are schooled by suffering and that wisdom bought this way comes too late to spend \u2014 leaving open the question the play never closes: was [[antigone|Antigone]] right to die for it?" }
];

var ENTITIES = [

{ id:"antigone", name:"Antigone", pron:"an-TIG-uh-nee", type:"character", tier:"major", themes:["law", "dead", "house"], essence:"The last daughter of a cursed house, who buries her brother against the city's edict and chooses a rock tomb over a life that would betray the dead.", sections:[
      { h:"The Dust", body:"Two brothers have killed each other under the walls of Thebes. One, [[eteocles|Eteocles]], is buried with honor. The other, [[polynices|Polynices]], led an army against the city, and so [[creon|Creon]] has decreed that his body lie unburied on the plain \u2014 no grave, no rite, food for the dogs and birds, under pain of death.\n\nAntigone will not have it. In the grey before dawn she goes out to the body and does what the law of the gods requires: she covers it. Not a full grave \u2014 a scattering of dry earth, a handful of dust, the thin ritual minimum that lets a soul pass. It is enough to break the edict. When a [[sentry|sentry]] and his fellows sweep the dust away and lie in wait, she comes back and does it again, in the open, keening over the bared corpse. They take her without a struggle." },
      { h:"Before the King", body:"Brought before [[creon|Creon]], she does not deny the deed \u2014 she claims it. His edict, she says, was a man's proclamation; it cannot overrule the [[unwritten_law|unwritten laws]] of the gods, which are not of today or yesterday and which no one knows the birth of. She owes her brother a grave, and she will pay it, whatever the city says.\n\nHer sister [[ismene|Ismene]], who refused to help, now tries to claim a share of the guilt and die beside her. Antigone will not allow it: the deed was hers alone, and she will not let a sister who chose life borrow her death." },
      { h:"The Bride of Death", body:"Sentenced, she is led to a cave in the rock and sealed inside with a little food \u2014 so the city can say it did not, technically, kill her. On the way she sings her own lament: no wedding now, no children, only a stone chamber and a marriage to death.\n\nHer reasoning here is strange and famous. A husband could be replaced, she says, a child re-borne \u2014 but with both parents dead, no new brother can ever come. So this brother, and this duty, are beyond price. It is the coldest and most personal accounting in the play, and readers have argued over it for two thousand years." },
      { h:"What She Chooses", body:"[[creon|Creon]] relents too late. When the tomb is opened, Antigone has already ended her own life inside it, on her own terms, unwilling to wait for the city's slow mercy. Her death pulls down [[haemon|Haemon]] after her, and [[eurydice|Eurydice]] after him. She never learns that she won \u2014 that the prophet, the son, the whole weight of the divine came round to her side. She is certain to the end, and the certainty is both her greatness and the thing that frightens us." },
      { h:"Before the Play: Two Brothers, One War", body:"To understand the morning this play opens on, you need the night before it.\n\n[[oedipus|Oedipus]], king of [[thebes|Thebes]] and Antigone's father, discovered that he had unknowingly killed his own father and married his own mother. He blinded himself and went into exile, leaving two sons \u2014 [[eteocles|Eteocles]] and [[polynices|Polynices]] \u2014 to rule the city between them. They agreed to take the throne in alternate years.\n\n[[eteocles|Eteocles]] took his year and then refused to give it up. [[polynices|Polynices]], cheated, went to the city of Argos, married into its royal house, and came back with an army \u2014 [[seven|seven captains against the seven gates]] of his own home. The assault failed. But in the fighting the two brothers found each other, and each killed the other.\n\nThat is the night before. In the morning, their uncle [[creon|Creon]] is king, one brother is a hero and the other is carrion, and Antigone is standing in the half-dark outside the palace, telling her sister what she means to do." }
    ], beneath:"<p>Antigone acts as <em>autonomos</em> \u2014 quite literally a law unto herself. That is her glory and the question mark over her. Is she the play's conscience, the one person who sees the [[unwritten_law|higher law]] plainly? Or is she a zealot, in love with death, as unbending in her way as [[creon|Creon]] is in his?</p><p>Hegel\u2019s (HAY-gul) famous reading refuses to pick: the tragedy is not right against wrong but <em>right against right</em> \u2014 the sacred claim of the family and the dead colliding with the legitimate claim of the city, each blind to the other. Both are partly justified; both are destroyed.</p><p>She is also a woman seizing action in a man's arena, and the play keeps noticing it. [[creon|Creon]] cannot bear to be beaten by a girl; the horror of her defiance, for him, is inseparable from her sex. Her strange calculus about the irreplaceable brother turns her love away from the living \u2014 from [[haemon|Haemon]], from [[ismene|Ismene]] \u2014 and toward the dead. Whether that is purity or a kind of coldness is left for the reader to weigh.</p><p>There is a harder question under the play, and it is the one that keeps it alive: does she have to die for this? [[creon|Creon]] is wrong \u2014 the play says so unmistakably \u2014 but Antigone does not merely oppose him. She courts the collision. She could bury her brother quietly; instead she goes back in daylight and wails over the corpse. She could accept [[ismene|Ismene]]'s help; instead she refuses it with contempt. She could plead; instead she taunts him. A conscience that insists on being seen is not quite the same thing as a conscience, and the play knows it.</p>", beyond:"<p>On stage she was played by a masked man, the corpse of [[polynices|Polynices]] never seen, her death reported rather than shown \u2014 Greek tragedy keeps its violence just offstage and lets language carry it. Scholars still argue over the play's one plot puzzle: the body is dusted twice, and no one is quite sure whether the first covering is meant to be Antigone's, the gods', or a deliberate ambiguity.</p><p>Ancient tradition holds that <em>Antigone</em> so pleased the Athenians that they elected Sophocles to a generalship soon after \u2014 a nice story, probably too tidy to be true.</p><p>Her afterlife is enormous. Jean Anouilh (an-WEE) staged an <em>Antigone</em> in occupied Paris in 1944 that both the Resistance and the collaborators thought was on their side. Ever since, she has been the standing image of the individual conscience against the state \u2014 conscripted by civil-rights marchers, dissidents, and dramatists on every continent. She is probably the most re-performed figure in Greek tragedy.</p>", rels:[
      { id:"polynices", label:"the brother she buries" },
      { id:"ismene", label:"the sister who will not, then would" },
      { id:"creon", label:"the uncle-king who condemns her" },
      { id:"haemon", label:"her betrothed, who dies for her" },
      { id:"unwritten_law", label:"the higher law she serves" },
      { id:"house_curse", label:"the doom she is born into" },
